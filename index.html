<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EYE OF HORUS</title>
<style>
  * { box-sizing: border-box; }

  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
    transition: font-family 0.3s;
  }

  .container {
    width: 90%;
    max-width: 600px;
    padding: 20px;
    text-align: center;
    position: relative;
  }

  /* Кнопка переключения языка */
  .lang-switch {
    position: absolute;
    top: 10px;
    right: 0;
    background: transparent;
    border: 1px solid #00ff88;
    color: #00ff88;
    padding: 5px 10px;
    font-size: 0.8em;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    z-index: 10;
  }

  .lang-switch:hover {
    background: #00ff88;
    color: #0d0d0d;
    box-shadow: 0 0 10px #00ff88;
  }

  h1 {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px rgba(0, 255, 136, 0.5);
    letter-spacing: 5px;
    font-size: 2.2em;
    margin: 30px 0 10px;
  }

  .subtitle {
    color: #ff0040;
    text-shadow: 0 0 8px #ff0040;
    letter-spacing: 2px;
    font-size: 0.85em;
    margin: 0 0 25px;
  }

  .input-section {
    background: #1a1a1a;
    border: 1px solid #00ff88;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 5px;
    color: #00ff88;
    font-size: 1em;
    font-family: inherit;
    outline: none;
    box-shadow: 0 0 5px rgba(0, 255, 136, 0.2);
  }

  input:focus { border-color: #00ff88; }

  button.action-btn {
    background: transparent;
    border: 2px solid #00ff88;
    color: #00ff88;
    padding: 14px 22px;
    font-family: inherit;
    font-size: 1em;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.3s;
  }

  button.action-btn:hover {
    background: #00ff88;
    color: #0d0d0d;
    box-shadow: 0 0 20px #00ff88;
  }

  button.action-btn:disabled {
    border-color: #555;
    color: #555;
    cursor: default;
    box-shadow: none;
    background: transparent;
  }

  .hidden { display: none; }

  .scanning {
    color: #ff0040;
    font-size: 1.1em;
    margin: 20px 0;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  .results {
    background: #1a1a1a;
    border: 1px solid #ff0040;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(255, 0, 64, 0.2);
  }

  .bar-row {
    margin-bottom: 22px;
    text-align: left;
    position: relative;
  }

  .bar-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 0.85em;
    letter-spacing: 1px;
    color: #bbb;
  }

  .bar-label-text { flex: 1; }

  .info-btn {
    width: 22px;
    height: 22px;
    min-width: 22px;
    padding: 0;
    margin-left: 8px;
    border: 1px solid #00ff88;
    border-radius: 50%;
    color: #00ff88;
    font-size: 0.85em;
    font-weight: bold;
    letter-spacing: 0;
    line-height: 20px;
    text-align: center;
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
  }

  .info-btn:hover,
  .info-btn.active {
    background: #00ff88;
    color: #0d0d0d;
    box-shadow: 0 0 10px #00ff88;
  }

  .info-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease, margin 0.35s ease;
    opacity: 0;
    font-size: 0.8em;
    line-height: 1.5;
    color: #9ad9b8;
    background: #111;
    border-left: 2px solid #00ff88;
    padding: 0 12px;
    margin: 0 0 0 0;
    border-radius: 0 5px 5px 0;
  }

  .info-panel.open {
    max-height: 300px;
    opacity: 1;
    padding: 10px 12px;
    margin: 0 0 10px 0;
  }

  .info-panel strong { color: #00ff88; }
  .info-panel em { color: #ff0040; font-style: normal; }

  .bar-track {
    background: #111;
    border-radius: 3px;
    height: 14px;
    overflow: hidden;
    border: 1px solid #222;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ff88, #ff0040);
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
  }

  .bar-value {
    display: inline-block;
    margin-top: 4px;
    color: #00ff88;
    font-weight: bold;
    font-size: 0.9em;
  }

  .rating {
    margin-top: 25px;
    border-top: 1px solid #333;
    padding-top: 20px;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .rating span:first-child { color: #ff0040; }

  #ratingValue {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88;
    font-size: 2em;
    display: block;
    margin-top: 10px;
  }

  .verdict {
    margin-top: 12px;
    font-size: 0.85em;
    color: #888;
    letter-spacing: 1px;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<div class="container">
  <button class="lang-switch" id="langSwitch">EN</button>
  
  <h1>EYE OF HORUS</h1>
  <p class="subtitle" id="subtitle">ДЕЦЕНТРАЛИЗОВАННЫЙ КАРМИЧЕСКИЙ АУДИТ</p>

  <div class="input-section">
    <input type="text" id="subject" placeholder="Имя субъекта или цитата...">
    <button class="action-btn" id="auditBtn">ЗАПУСТИТЬ ФРАКТАЛЬНЫЙ АУДИТ</button>
  </div>

  <div id="scanning" class="scanning hidden">Сканирование инфополя...</div>

  <div id="results" class="results hidden">

    <!-- ИЭС -->
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-label-text" id="label-iek">ИЭС — Индекс Энтропии Слова</span>
        <button class="info-btn" data-target="info-iek" aria-label="Info">i</button>
      </div>
      <div class="info-panel" id="info-iek"></div>
      <div class="bar-track"><div class="bar-fill" id="iekFill"></div></div>
      <span class="bar-value" id="iekValue">0%</span>
    </div>

    <!-- ФСВ -->
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-label-text" id="label-fsv">ФСВ — Физический След Вранья</span>
        <button class="info-btn" data-target="info-fsv" aria-label="Info">i</button>
      </div>
      <div class="info-panel" id="info-fsv"></div>
      <div class="bar-track"><div class="bar-fill" id="fsvFill"></div></div>
      <span class="bar-value" id="fsvValue">0%</span>
    </div>

    <!-- ВП -->
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-label-text" id="label-vp">ВП — Вектор Паразитизма</span>
        <button class="info-btn" data-target="info-vp" aria-label="Info">i</button>
      </div>
      <div class="info-panel" id="info-vp"></div>
      <div class="bar-track"><div class="bar-fill" id="vpFill"></div></div>
      <span class="bar-value" id="vpValue">0%</span>
    </div>

    <div class="rating">
      <span id="rating-label">Кармический Рейтинг Субъекта</span>
      <span id="ratingValue">0%</span>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
</div>

<script>
  /* --- СЛОВАРИ --- */
  const translations = {
    ru: {
      subtitle: "ДЕЦЕНТРАЛИЗОВАННЫЙ КАРМИЧЕСКИЙ АУДИТ",
      placeholder: "Имя субъекта или цитата...",
      btnAudit: "ЗАПУСТИТЬ ФРАКТАЛЬНЫЙ АУДИТ",
      scanning: "Сканирование инфополя...",
      labelIek: "ИЭС — Индекс Энтропии Слова",
      labelFsv: "ФСВ — Физический След Вранья",
      labelVp: "ВП — Вектор Паразитизма",
      ratingLabel: "Кармический Рейтинг Субъекта",
      infoIek: "<strong>Что это:</strong> насколько плотно слова субъекта превращаются в белый шум — вода, общие фразы, канцелярит, повторы, отсутствие проверяемых фактов.<br><br><strong>Как читать:</strong><br><em>0–30%</em> — речь плотная, конкретная, есть цифры и факты.<br><em>31–70%</em> — середина: смысл есть, но разбавлен.<br><em>71–100%</em> — словесный туман: много слов, мало смысла.",
      infoFsv: "<strong>Что это:</strong> разрыв между обещанием и физической реальностью — невыполненные сроки, проваленные проекты, «собака съела отчёт», расхождение слов с документом или поступком.<br><br><strong>Как читать:</strong><br><em>0–30%</em> — следов вранья почти нет, слова стыкуются с делами.<br><em>31–70%</em> — есть «мутные пятна», но не доказано.<br><em>71–100%</em> — физический след ярко выражен: дела расходятся со словами.",
      infoVp: "<strong>Что это:</strong> сколько ресурса субъект забирает из системы, не возвращая эквивалент — дотации, привилегии, доступ к общему благу в обмен на пустоту.<br><br><strong>Как читать:</strong><br><em>0–30%</em> — субъект скорее донор, чем паразит.<br><em>31–70%</em> — нейтральный обмен, бывают перекосы.<br><em>71–100%</em> — паразитический вектор выражен: берёт больше, чем даёт.",
      verdicts: [
        "СУБЪЕКТ ПРОЗРАЧЕН. ГЛАЗ НЕ ВИДИТ ТЕНИ.",
        "ЛЁГКАЯ ДЫМКА. ДОПУСТИМЫЙ УРОВЕНЬ ШУМА.",
        "СЕРЫЙ СЕКТОР. СЛОВА И ДЕЛА РАСХОДЯТСЯ НАПОЛОВИНУ.",
        "ПЛОТНЫЙ ТУМАН. ГЛАЗ ФИКСИРУЕТ ПАРАЗИТИЧЕСКИЙ ВЕКТОР.",
        "ПОЛНОЕ ЗАТМЕНИЕ. СУБЪЕКТ — ЧЁРНАЯ ДЫРА ИНФОПОЛЯ."
      ],
      errEmpty: "Введите имя или цитату!"
    },
    en: {
      subtitle: "DECENTRALIZED KARMIC AUDIT",
      placeholder: "Subject name or quote...",
      btnAudit: "LAUNCH FRACTAL AUDIT",
      scanning: "Scanning info-field...",
      labelIek: "SEI — Speech Entropy Index",
      labelFsv: "PTL — Physical Trace of Lies",
      labelVp: "PV — Parasitism Vector",
      ratingLabel: "Karmic Rating of Subject",
      infoIek: "<strong>What is it:</strong> how densely the subject's words turn into white noise — water, clichés, bureaucratic jargon, repetitions, lack of verifiable facts.<br><br><strong>How to read:</strong><br><em>0–30%</em> — speech is dense, specific, with numbers and facts.<br><em>31–70%</em> — middle ground: meaning exists but diluted.<br><em>71–100%</em> — verbal fog: many words, little meaning.",
      infoFsv: "<strong>What is it:</strong> the gap between promise and physical reality — missed deadlines, failed projects, discrepancies between words and documents or actions.<br><br><strong>How to read:</strong><br><em>0–30%</em> — almost no traces of lies, words match deeds.<br><em>31–70%</em> — there are 'murky spots' but unproven.<br><em>71–100%</em> — the physical trace is clearly expressed: deeds diverge from words.",
      infoVp: "<strong>What is it:</strong> how much resource the subject takes from the system without returning an equivalent — subsidies, privileges, access to common good in exchange for emptiness.<br><br><strong>How to read:</strong><br><em>0–30%</em> — the subject is more of a donor than a parasite.<br><em>31–70%</em> — neutral exchange, occasional imbalances.<br><em>71–100%</em> — parasitic vector is expressed: takes more than gives.",
      verdicts: [
        "SUBJECT IS TRANSPARENT. EYE SEES NO SHADOW.",
        "LIGHT HAZE. ACCEPTABLE NOISE LEVEL.",
        "GREY SECTOR. WORDS AND DEEDS HALF-MATCH.",
        "DENSE FOG. EYE FIXES THE PARASITIC VECTOR.",
        "TOTAL ECLIPSE. SUBJECT IS A BLACK HOLE OF INFO-FIELD."
      ],
      errEmpty: "Enter a name or quote!"
    }
  };

  let currentLang = localStorage.getItem('horus_lang') || 'ru';
  if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
  /* --- DOM ЭЛЕМЕНТЫ --- */
  const langSwitch = document.getElementById('langSwitch');
  const subtitle = document.getElementById('subtitle');
  const subjectInput = document.getElementById('subject');
  const auditBtn = document.getElementById('auditBtn');
  const scanningDiv = document.getElementById('scanning');
  const resultsDiv = document.getElementById('results');
  const ratingLabel = document.getElementById('rating-label');
  const verdictEl = document.getElementById('verdict');
  
  const labelIek = document.getElementById('label-iek');
  const labelFsv = document.getElementById('label-fsv');
  const labelVp = document.getElementById('label-vp');
  const infoIek = document.getElementById('info-iek');
  const infoFsv = document.getElementById('info-fsv');
  const infoVp = document.getElementById('info-vp');

  /* --- ФУНКЦИЯ ПЕРЕВОДА --- */
  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('horus_lang', lang);
    const t = translations[lang];
    document.documentElement.lang = lang;

    langSwitch.textContent = lang === 'ru' ? 'EN' : 'RU';
    subtitle.textContent = t.subtitle;
    subjectInput.placeholder = t.placeholder;
    auditBtn.textContent = t.btnAudit;
    scanningDiv.textContent = t.scanning;
    ratingLabel.textContent = t.ratingLabel;

    labelIek.textContent = t.labelIek;
    labelFsv.textContent = t.labelFsv;
    labelVp.textContent = t.labelVp;

    infoIek.innerHTML = t.infoIek;
    infoFsv.innerHTML = t.infoFsv;
    infoVp.innerHTML = t.infoVp;

    // Пересчитываем вердикт, если результаты уже на экране
    if (!resultsDiv.classList.contains('hidden')) {
      const r = parseInt(document.getElementById('ratingValue').textContent) || 0;
      verdictEl.textContent = getVerdict(r);
    }
  }

  langSwitch.addEventListener('click', () => {
    applyLanguage(currentLang === 'ru' ? 'en' : 'ru');
  });

  /* --- КНОПКИ "i" --- */
  document.querySelectorAll('.info-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      const target = document.getElementById(btn.dataset.target);
      const isOpen = target.classList.contains('open');

      document.querySelectorAll('.info-panel.open').forEach(function (p) {
        if (p !== target) p.classList.remove('open');
      });
      document.querySelectorAll('.info-btn.active').forEach(function (b) {
        if (b !== btn) b.classList.remove('active');
      });

      target.classList.toggle('open', !isOpen);
      btn.classList.toggle('active', !isOpen);
    });
  });

  /* --- ХЕШ --- */
  function hashString(str) {
    let hash = 5381;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) + hash + str.charCodeAt(i)) >>> 0;
    }
    return hash;
  }

  function getIndices(subject) {
    const h = hashString(subject);
    return { iek: h % 101, fsv: (h >>> 4) % 101, vp: (h >>> 8) % 101 };
  }

  /* --- АНИМАЦИИ --- */
  function animateBar(fill, valueText, target, duration) {
    const startTime = performance.now();
    function frame() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(eased * target);
      fill.style.width = current + '%';
      valueText.textContent = current + '%';
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function animateText(el, target, duration) {
    const startTime = performance.now();
    function frame() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * target) + '%';
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* --- ВЕРДИКТ --- */
  function getVerdict(rating) {
    const v = translations[currentLang].verdicts;
    if (rating <= 20) return v[0];
    if (rating <= 40) return v[1];
    if (rating <= 60) return v[2];
    if (rating <= 80) return v[3];
    return v[4];
  }

  /* --- ЗАПУСК АУДИТА --- */
  auditBtn.addEventListener('click', function () {
    const subject = subjectInput.value.trim();
    if (!subject) {
      subjectInput.style.borderColor = '#ff0040';
      subjectInput.placeholder = translations[currentLang].errEmpty;
      setTimeout(() => {
        subjectInput.placeholder = translations[currentLang].placeholder;
      }, 2000);
      return;
    }

    subjectInput.style.borderColor = '#333';
    auditBtn.disabled = true;
    scanningDiv.classList.remove('hidden');
    resultsDiv.classList.add('hidden');
    verdictEl.textContent = '';

    const { iek, fsv, vp } = getIndices(subject);

    setTimeout(function () {
      scanningDiv.classList.add('hidden');
      resultsDiv.classList.remove('hidden');

      const duration = 1500;
      animateBar(document.getElementById('iekFill'), document.getElementById('iekValue'), iek, duration);
      animateBar(document.getElementById('fsvFill'), document.getElementById('fsvValue'), fsv, duration);
      animateBar(document.getElementById('vpFill'), document.getElementById('vpValue'), vp, duration);

      const rating = Math.round((iek + fsv + vp) / 3);
      animateText(document.getElementById('ratingValue'), rating, duration);

      setTimeout(function () {
        verdictEl.textContent = getVerdict(rating);
        auditBtn.disabled = false;
      }, duration + 100);
    }, 1000);
  });

  /* --- ИНИЦИАЛИЗАЦИЯ --- */
  applyLanguage(currentLang);

</script>

</body>
</html>
